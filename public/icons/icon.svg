<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#0A0A0B" rx="128"/>
  
  <!-- Paper texture overlay -->
  <rect width="512" height="512" fill="url(#paperTexture)" rx="128"/>
  
  <!-- Ink brush stroke for ザイロ -->
  <g transform="translate(256, 256) scale(0.8)">
    <!-- ザ -->
    <path d="M-120,-60 Q-30,-100 30,-60" stroke="#C8553D" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M-30,-100 Q-30,-20 -30,40" stroke="#C8553D" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M-60,-20 Q-30,10 0,-20" stroke="#C8553D" stroke-width="10" fill="none" stroke-linecap="round"/>
    
    <!-- イ -->
    <path d="M60,-100 L120,-100" stroke="#C8553D" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M90,-100 L90,40" stroke="#C8553D" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M60,40 L120,40" stroke="#C8553D" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- ロ -->
    <path d="M150,-100 L230,-100" stroke="#C8553D" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M150,-100 L150,40" stroke="#C8553D" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M230,-100 L230,40" stroke="#C8553D" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M150,-30 L230,-30" stroke="#C8553D" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M150,40 L230,40" stroke="#C8553D" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Vermilion seal -->
  <g transform="translate(400, 400)">
    <circle r="50" fill="#C8553D"/>
    <circle r="42" fill="none" stroke="#C8553D" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" font-family="'Noto Serif JP', serif" font-size="28" font-weight="bold" fill="#F5F0E8">在朗</text>
  </g>
  
  <defs>
    <filter id="paperTexture" x="0" y="0" width="512" height="512">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
  </defs>
</svg>